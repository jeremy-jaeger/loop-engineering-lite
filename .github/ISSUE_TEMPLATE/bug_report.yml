name: Bug report
description: Something the harness did (or failed to do) incorrectly
title: "[bug] "
labels: ["bug"]
body:
  - type: markdown
    attributes:
      value: |
        Thanks for the report. Include a prompt, model, and the iteration log if you can — this project lives and dies on traces.
  - type: textarea
    id: prompt
    attributes:
      label: Prompt
      description: Exact agent-loop / main.py invocation.
      placeholder: agent-loop "Use TDD to write is_palindrome(s)…"
    validations:
      required: true
  - type: textarea
    id: what
    attributes:
      label: Expected vs actual
      placeholder: Expected … / Actual …
    validations:
      required: true
  - type: input
    id: model
    attributes:
      label: Model
      description: Output of `ollama list` (or the --model tag you used).
      placeholder: qwen3.5:0.8b
    validations:
      required: true
  - type: textarea
    id: log
    attributes:
      label: Full log excerpt
      description: Paste the iteration log, including [ERROR] / [SIMULATION …] lines.
      render: text
    validations:
      required: true
  - type: input
    id: env
    attributes:
      label: Environment
      description: OS, Python version, install method (`pip install -e .` vs raw main.py).
      placeholder: macOS 15 / Python 3.12 / pip install -e .
