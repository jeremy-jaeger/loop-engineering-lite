<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 920 520" role="img">
  <title>Example agent run in the terminal</title>
  <rect width="920" height="520" rx="16" fill="#020617"/>
  <rect x="1" y="1" width="918" height="518" rx="16" fill="none" stroke="#1e293b"/>
  <rect width="920" height="40" rx="16" fill="#0f172a"/>
  <rect y="24" width="920" height="16" fill="#0f172a"/>
  <circle cx="22" cy="20" r="6" fill="#f87171"/>
  <circle cx="42" cy="20" r="6" fill="#fbbf24"/>
  <circle cx="62" cy="20" r="6" fill="#34d399"/>
  <text x="86" y="25" fill="#94a3b8" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="13">agent-loop - local Ollama</text>
  <g font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="13">
    <text x="24" y="72" fill="#64748b">$ python3 main.py "Use TDD to write is_palindrome in str_utils.py"</text>
    <text x="24" y="104" fill="#5eead4">[START]</text>
    <text x="92" y="104" fill="#cbd5e1"> Agent initialized with prompt</text>
    <text x="24" y="128" fill="#38bdf8">[WORLD MODEL]</text>
    <text x="148" y="128" fill="#cbd5e1"> Virtual File System loaded. Reality is sandboxed.</text>
    <text x="24" y="160" fill="#94a3b8">--- Iteration 1 ---</text>
    <text x="24" y="184" fill="#a78bfa">[REASONING]</text>
    <text x="24" y="208" fill="#e2e8f0">Write failing tests first, then implement until pytest is green.</text>
    <text x="24" y="240" fill="#f59e0b">[ACTION]</text>
    <text x="100" y="240" fill="#e2e8f0"> write_file -&gt; tests/test_str_utils.py</text>
    <text x="24" y="272" fill="#f59e0b">[ACTION]</text>
    <text x="100" y="272" fill="#e2e8f0"> write_file -&gt; str_utils.py</text>
    <text x="24" y="304" fill="#f59e0b">[ACTION]</text>
    <text x="100" y="304" fill="#e2e8f0"> run_command -&gt; python3 -m pytest -q</text>
    <text x="24" y="336" fill="#34d399">[OBSERVATION]</text>
    <text x="148" y="336" fill="#86efac">[SIMULATION VERIFIED SUCCESS]</text>
    <text x="24" y="360" fill="#86efac">3 passed in 0.04s</text>
    <text x="24" y="392" fill="#34d399">[VFS COMMIT]</text>
    <text x="140" y="392" fill="#cbd5e1"> Writing successful simulation back to reality...</text>
    <text x="24" y="424" fill="#60a5fa">[DATASET EXPORT]</text>
    <text x="172" y="424" fill="#cbd5e1"> Trajectory saved to dataset.jsonl</text>
    <text x="24" y="456" fill="#fb7185">[MEMORY SAVED]</text>
    <text x="148" y="456" fill="#cbd5e1"> New heuristic committed to knowledge.json</text>
    <text x="24" y="492" fill="#64748b">=== Execution Complete ===</text>
  </g>
</svg>
