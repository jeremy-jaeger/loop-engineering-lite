<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1100 560" role="img" aria-labelledby="title desc">
  <title id="title">Loop Engineering Lite architecture</title>
  <desc id="desc">Think, act, verify, then commit only successful simulations. Lessons and trajectories feed the next run.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#0b1220"/>
      <stop offset="100%" stop-color="#111827"/>
    </linearGradient>
    <linearGradient id="accent" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#14b8a6"/>
      <stop offset="100%" stop-color="#f59e0b"/>
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="6" result="b"/>
      <feMerge>
        <feMergeNode in="b"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>
  <rect width="1100" height="560" rx="24" fill="url(#bg)"/>
  <rect x="1" y="1" width="1098" height="558" rx="24" fill="none" stroke="#1f2937" stroke-width="2"/>

  <text x="48" y="52" fill="#e5e7eb" font-family="ui-sans-serif, system-ui, sans-serif" font-size="22" font-weight="700">Execution flywheel</text>
  <text x="48" y="78" fill="#9ca3af" font-family="ui-sans-serif, system-ui, sans-serif" font-size="14">Nothing hits disk until the sandbox simulation returns a binary success signal.</text>

  <!-- boxes -->
  <g font-family="ui-sans-serif, system-ui, sans-serif">
    <rect x="48" y="120" width="200" height="110" rx="16" fill="#0f172a" stroke="#14b8a6" stroke-width="1.5"/>
    <text x="148" y="165" text-anchor="middle" fill="#5eead4" font-size="12" letter-spacing="1.5">PROMPT</text>
    <text x="148" y="190" text-anchor="middle" fill="#f9fafb" font-size="16" font-weight="600">User task</text>
    <text x="148" y="212" text-anchor="middle" fill="#9ca3af" font-size="12">CLI or script</text>

    <rect x="308" y="120" width="200" height="110" rx="16" fill="#0f172a" stroke="#38bdf8" stroke-width="1.5"/>
    <text x="408" y="165" text-anchor="middle" fill="#7dd3fc" font-size="12" letter-spacing="1.5">THINK</text>
    <text x="408" y="190" text-anchor="middle" fill="#f9fafb" font-size="16" font-weight="600">Ollama JSON</text>
    <text x="408" y="212" text-anchor="middle" fill="#9ca3af" font-size="12">strict schema</text>

    <rect x="568" y="120" width="200" height="110" rx="16" fill="#0f172a" stroke="#a78bfa" stroke-width="1.5"/>
    <text x="668" y="165" text-anchor="middle" fill="#c4b5fd" font-size="12" letter-spacing="1.5">ACT</text>
    <text x="668" y="190" text-anchor="middle" fill="#f9fafb" font-size="16" font-weight="600">Tool dispatch</text>
    <text x="668" y="212" text-anchor="middle" fill="#9ca3af" font-size="12">read / write / shell</text>

    <rect x="828" y="120" width="220" height="110" rx="16" fill="#0f172a" stroke="#f59e0b" stroke-width="1.5"/>
    <text x="938" y="165" text-anchor="middle" fill="#fcd34d" font-size="12" letter-spacing="1.5">VERIFY</text>
    <text x="938" y="190" text-anchor="middle" fill="#f9fafb" font-size="16" font-weight="600">VFS sandbox</text>
    <text x="938" y="212" text-anchor="middle" fill="#9ca3af" font-size="12">score 1.0 or 0.0</text>

    <rect x="178" y="330" width="240" height="110" rx="16" fill="#0f172a" stroke="#34d399" stroke-width="1.5"/>
    <text x="298" y="375" text-anchor="middle" fill="#6ee7b7" font-size="12" letter-spacing="1.5">COMMIT</text>
    <text x="298" y="400" text-anchor="middle" fill="#f9fafb" font-size="16" font-weight="600">Write to reality</text>
    <text x="298" y="422" text-anchor="middle" fill="#9ca3af" font-size="12">only after success</text>

    <rect x="478" y="330" width="240" height="110" rx="16" fill="#0f172a" stroke="#fb7185" stroke-width="1.5"/>
    <text x="598" y="375" text-anchor="middle" fill="#fda4af" font-size="12" letter-spacing="1.5">LEARN</text>
    <text x="598" y="400" text-anchor="middle" fill="#f9fafb" font-size="16" font-weight="600">knowledge.json</text>
    <text x="598" y="422" text-anchor="middle" fill="#9ca3af" font-size="12">heuristics for next run</text>

    <rect x="778" y="330" width="240" height="110" rx="16" fill="#0f172a" stroke="#60a5fa" stroke-width="1.5"/>
    <text x="898" y="375" text-anchor="middle" fill="#93c5fd" font-size="12" letter-spacing="1.5">EXPORT</text>
    <text x="898" y="400" text-anchor="middle" fill="#f9fafb" font-size="16" font-weight="600">ShareGPT JSONL</text>
    <text x="898" y="422" text-anchor="middle" fill="#9ca3af" font-size="12">fine-tune later</text>
  </g>

  <!-- arrows -->
  <g stroke="url(#accent)" stroke-width="2.5" fill="none" stroke-linecap="round">
    <path d="M248 175 L308 175"/>
    <path d="M508 175 L568 175"/>
    <path d="M768 175 L828 175"/>
    <path d="M938 230 L938 300 L298 300 L298 330"/>
    <path d="M418 385 L478 385"/>
    <path d="M718 385 L778 385"/>
    <path d="M148 230 C148 280 80 280 80 385 C80 490 408 490 408 440" opacity="0.7"/>
  </g>
  <g fill="#14b8a6">
    <polygon points="308,175 296,169 296,181"/>
    <polygon points="568,175 556,169 556,181"/>
    <polygon points="828,175 816,169 816,181"/>
    <polygon points="298,330 292,318 304,318"/>
    <polygon points="478,385 466,379 466,391"/>
    <polygon points="778,385 766,379 766,391"/>
  </g>
  <text x="48" y="530" fill="#6b7280" font-family="ui-sans-serif, system-ui, sans-serif" font-size="12">Harness also truncates huge observations and slides memory so tiny local models stay in-context.</text>
</svg>
